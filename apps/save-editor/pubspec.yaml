name: goresave
description: "goresave: Gothic Remake Savegame-Editor"
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  ffi: ^2.1.4
  file_selector: ^1.0.3
  flutter_riverpod: ^3.2.1
  go_router: ^17.0.0
  intl: any
  path: ^1.9.0
  state_notifier: ^1.0.0
  window_manager: ^0.5.1
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.2
  auto_updater:
    git:
      url: https://github.com/dh0er/auto_updater.git
      path: packages/auto_updater
      ref: swiftpm-support

dependency_overrides:
  auto_updater_windows:
    git:
      url: https://github.com/dh0er/auto_updater.git
      ref: swiftpm-support
      path: packages/auto_updater_windows
  auto_updater_macos:
    git:
      url: https://github.com/dh0er/auto_updater.git
      ref: swiftpm-support
      path: packages/auto_updater_macos
  auto_updater_platform_interface:
    git:
      url: https://github.com/dh0er/auto_updater.git
      ref: swiftpm-support
      path: packages/auto_updater_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter

  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/goresave_icon.png
    - assets/item_catalog.json
    - assets/npc_catalog.json
    - assets/knowledge_catalog.json
