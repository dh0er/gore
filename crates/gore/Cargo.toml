[package]
name = "gore"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "gore"
path = "src/main.rs"

[dependencies]
gore-reflect = { path = "../gore-reflect" }
gore-catalog = { path = "../gore-catalog" }
gore-loc = { path = "../gore-loc" }
gore-modgen = { path = "../gore-modgen" }
gore-as = { path = "../gore-as" }
gore-fmod = { path = "../gore-fmod" }
gore-mod = { path = "../gore-mod" }
gore-tex = { path = "../gore-tex" }
image = "0.25"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"

[[test]]
name = "dump_test"
path = "tests/integration/dump_test.rs"

[[test]]
name = "stubs_test"
path = "tests/integration/stubs_test.rs"

[[test]]
name = "catalog_test"
path = "tests/integration/catalog_test.rs"

[[test]]
name = "scaffold_test"
path = "tests/integration/scaffold_test.rs"

[[test]]
name = "gen_test"
path = "tests/integration/gen_test.rs"

[[test]]
name = "package_test"
path = "tests/integration/package_test.rs"

[[test]]
name = "deploy_shared_test"
path = "tests/integration/deploy_shared_test.rs"

[[test]]
name = "as_cache_test"
path = "tests/integration/as_cache_test.rs"
