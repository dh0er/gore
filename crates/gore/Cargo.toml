[package]
name = "gore"
version = "0.3.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "gore"
path = "src/main.rs"

[dependencies]
gore-reflect = { path = "../gore-reflect" }
gore-catalog = { path = "../gore-catalog" }
gore-loc = { path = "../gore-loc" }
gore-mcp = { path = "../gore-mcp" }
gore-modgen = { path = "../gore-modgen" }
gore-as = { path = "../gore-as" }
gore-asset = { path = "../gore-asset" }
gore-fmod = { path = "../gore-fmod" }
gore-generation = { path = "../gore-generation" }
gore-mod = { path = "../gore-mod" }
gore-story-catalog = { path = "../gore-story-catalog" }
gore-tex = { path = "../gore-tex" }
gore-vo = { path = "../gore-vo" }
image = "0.25"
clap = { version = "4", features = ["derive"] }
# Markdown -> HTML for `gore guide html`. default-features off drops the crate's own
# CLI/getopts baggage; we only ever call the parser and the HTML writer.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
blake3 = "1"
# Integration tests do not inherit the binary's regular dependencies, and `mcp_spec_sync` needs to
# read the MCP command table in order to compare it against clap's own `--help`.
gore-mcp = { path = "../gore-mcp" }
gore-asset = { path = "../gore-asset", features = ["test-fixtures"] }
# `audio list` has no `.bank` fixture in the tree and the inner FSB5 builder is not a bank; this
# exposes gore-fmod's own RIFF/FEV wrapper builder the same way gore-asset exposes its fixtures.
gore-fmod = { path = "../gore-fmod", features = ["test-fixtures"] }
predicates = "2"
retoc = { path = "../../vendor/retoc" }
usmap = { git = "https://github.com/trumank/jmap.git", rev = "909bce98a33e7d1932941404af7865514249f6be" }
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
# For building a real encrypted AlkimiaLocalization .lcache fixture in the (ignored) `gore mgr apply`
# integration test (mirrors gore-loc's own AES-256-ECB encoding without its private test helpers).
aes = "0.8"

[[test]]
name = "dump_test"
path = "tests/integration/dump_test.rs"

[[test]]
name = "stubs_test"
path = "tests/integration/stubs_test.rs"

[[test]]
name = "catalog_test"
path = "tests/integration/catalog_test.rs"

[[test]]
name = "scaffold_test"
path = "tests/integration/scaffold_test.rs"

[[test]]
name = "gen_test"
path = "tests/integration/gen_test.rs"

[[test]]
name = "package_test"
path = "tests/integration/package_test.rs"

[[test]]
name = "deploy_shared_test"
path = "tests/integration/deploy_shared_test.rs"

[[test]]
name = "as_cache_test"
path = "tests/integration/as_cache_test.rs"

[[test]]
name = "mgr"
path = "tests/integration/mgr.rs"

[[test]]
name = "config_test"
path = "tests/integration/config_test.rs"

[[test]]
name = "voice_test"
path = "tests/integration/voice_test.rs"

[[test]]
name = "asset_test"
path = "tests/integration/asset_test.rs"

[[test]]
name = "mcp_serve_test"
path = "tests/integration/mcp_serve_test.rs"

[[test]]
name = "mcp_spec_sync"
path = "tests/integration/mcp_spec_sync.rs"

[[test]]
name = "audio_test"
path = "tests/integration/audio_test.rs"

[[test]]
name = "modcmd_test"
path = "tests/integration/modcmd_test.rs"

[[test]]
name = "npc_test"
path = "tests/integration/npc_test.rs"
