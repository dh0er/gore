[package]
name = "gore-mod"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gore-modgen = { path = "../gore-modgen" }
gore-loc = { path = "../gore-loc" }
gore-fmod = { path = "../gore-fmod" }
gore-tex = { path = "../gore-tex" }
gore-as = { path = "../gore-as" }
gore-vo = { path = "../gore-vo" }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# For building a real encrypted AlkimiaLocalization .lcache fixture in the manager apply tests
# (mirrors gore-loc's own AES-256-ECB encoding without depending on its private test helpers).
aes = "0.8"
