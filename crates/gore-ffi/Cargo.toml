[package]
name = "gore-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI (dart:ffi) bridge for gore-mod: JSON-in/JSON-out mod engine."

[lib]
crate-type = ["cdylib"]

[dependencies]
gore-authoring = { path = "../gore-authoring" }
gore-asset = { path = "../gore-asset" }
gore-npc-catalog = { path = "../gore-npc-catalog" }
gore-story-catalog = { path = "../gore-story-catalog" }
gore-story-build = { path = "../gore-story-build" }
gore-story-inventory = { path = "../gore-story-inventory" }
gore-reflect = { path = "../gore-reflect" }
gore-modgen = { path = "../gore-modgen" }
gore-loc = { path = "../gore-loc" }
gore-mod = { path = "../gore-mod" }
gore-fmod = { path = "../gore-fmod" }
gore-tex = { path = "../gore-tex" }
gore-as = { path = "../gore-as" }
gore-vo = { path = "../gore-vo" }
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
retoc = { path = "../../vendor/retoc" }
usmap = { git = "https://github.com/trumank/jmap.git", rev = "909bce98a33e7d1932941404af7865514249f6be" }
zip = { version = "2", default-features = false, features = ["deflate"] }
