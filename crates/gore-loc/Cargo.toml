[package]
name = "gore-loc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Localization cache decrypt + discovery/paths/store for gore."

[lib]
crate-type = ["rlib"]

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
aes = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
