[package]
name = "gore-save"
version.workspace = true
edition = "2024"
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
gore-loc = { path = "../gore-loc" }
gore-oodle = { path = "../gore-oodle" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
