[package]
name = "goresave_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
gore_core = { path = "../gore_core" }
goresave_oodle = { path = "../goresave_oodle" }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
