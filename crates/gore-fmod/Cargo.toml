[package]
name = "gore-fmod"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Synthetic `.bank` builders for downstream tests. Default-off so nothing in a shipped binary can
# reach a fixture builder, and so a normal build never compiles it.
test-fixtures = []

[dependencies]
lewton = "0.10"

[dev-dependencies]
# `bank_summary_at` reads a bank from disk, so proving it agrees with the in-memory reader needs a
# bank on disk.
tempfile = "3"
