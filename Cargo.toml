[workspace]
members = ["crates/*"]
# retoc is a vendored fork used only as gore-tex's path dependency; its upstream test
# suite needs large game-asset fixtures we don't ship (vendor/retoc/tests/*), so it must
# not be a workspace member or `cargo test` would run — and fail — those fixture tests.
exclude = ["vendor/retoc"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
