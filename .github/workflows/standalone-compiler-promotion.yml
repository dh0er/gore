name: Internal standalone compiler signing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-compiler-signing-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality-gates:
    name: Exact-commit CI quality gates
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build-sign-candidate:
    name: Build, sign, attest, and retain the internal candidate
    needs: quality-gates
    runs-on: windows-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and test the unsigned native candidate
        shell: pwsh
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP 'gore-as-signing-native'
          python scripts/standalone_compiler_bundle.py build-native --build-root $buildRoot

      - name: Sign the internal candidate exactly once
        shell: pwsh
        env:
          GORE_SIGN: "1"
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          $buildRoot = Join-Path $env:RUNNER_TEMP 'gore-as-signing-native'
          $outputRoot = Join-Path $env:RUNNER_TEMP 'gore-as-signing-output'
          New-Item -ItemType Directory -Path $outputRoot | Out-Null
          $sidecar = Join-Path $buildRoot 'sidecar\Release\gore-as-standalone-compiler.exe'
          $identity = Join-Path $outputRoot 'signed-sidecar-identity.json'
          python scripts/standalone_compiler_bundle.py sign-sidecar-once `
            --sidecar $sidecar `
            --identity-output $identity
          $retainedSidecar = Join-Path $outputRoot 'gore-as-standalone-compiler.exe'
          [IO.File]::Copy($sidecar, $retainedSidecar, $false)
          $identityRecord = Get-Content -Raw -LiteralPath $identity | ConvertFrom-Json
          $retainedLength = (Get-Item -LiteralPath $retainedSidecar).Length
          $retainedSha256 = (Get-FileHash -LiteralPath $retainedSidecar -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($identityRecord.schema -ne 'gore.as.signed-standalone-compiler-identity' -or `
              $identityRecord.schema_version -ne 1 -or `
              $identityRecord.signed.byte_len -ne $retainedLength -or `
              $identityRecord.signed.sha256 -ne $retainedSha256) {
            Write-Error "retained sidecar differs from its one-time signing identity"
            exit 1
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $retainedSidecar
          if ($signature.Status -ne 'Valid') {
            Write-Error "final Authenticode status is $($signature.Status)"
            exit 1
          }
          $identityBytes = [IO.File]::ReadAllBytes($identity)
          [ordered]@{
            schema = 'gore.as.internal-standalone-compiler-signing-provenance'
            schema_version = 1
            repository = '${{ github.repository }}'
            commit = '${{ github.sha }}'
            workflow_sha = '${{ github.workflow_sha }}'
            workflow_run_id = [UInt64]'${{ github.run_id }}'
            workflow_run_attempt = [UInt32]'${{ github.run_attempt }}'
            signed_identity = [ordered]@{
              byte_len = [UInt64]$identityBytes.LongLength
              sha256 = (Get-FileHash -LiteralPath $identity -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          } | ConvertTo-Json | Set-Content `
            -LiteralPath (Join-Path $outputRoot 'source-provenance.json') `
            -Encoding utf8NoBOM

      - name: Attest the signed internal candidate and evidence
        id: attest
        uses: actions/attest@v4
        with:
          github-token: ${{ github.token }}
          subject-path: |
            ${{ runner.temp }}/gore-as-signing-output/gore-as-standalone-compiler.exe
            ${{ runner.temp }}/gore-as-signing-output/signed-sidecar-identity.json
            ${{ runner.temp }}/gore-as-signing-output/source-provenance.json

      - name: Verify and stage the GitHub attestation bundle
        shell: pwsh
        run: |
          $outputRoot = Join-Path $env:RUNNER_TEMP 'gore-as-signing-output'
          $bundle = Join-Path $outputRoot 'github-attestation.sigstore.json'
          [IO.File]::Copy('${{ steps.attest.outputs.bundle-path }}', $bundle, $false)
          $subjects = @(
            (Join-Path $outputRoot 'gore-as-standalone-compiler.exe'),
            (Join-Path $outputRoot 'signed-sidecar-identity.json'),
            (Join-Path $outputRoot 'source-provenance.json')
          )
          foreach ($subject in $subjects) {
            gh attestation verify $subject `
              --repo '${{ github.repository }}' `
              --bundle $bundle `
              --signer-workflow '${{ github.repository }}/.github/workflows/standalone-compiler-promotion.yml' `
              --signer-digest '${{ github.workflow_sha }}' `
              --source-digest '${{ github.sha }}' `
              --deny-self-hosted-runners
            if ($LASTEXITCODE -ne 0) {
              Write-Error "GitHub attestation verification failed for $subject"
              exit 1
            }
          }

      - name: Retain the signed candidate as an internal workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gore-as-signed-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/gore-as-signing-output/gore-as-standalone-compiler.exe
            ${{ runner.temp }}/gore-as-signing-output/signed-sidecar-identity.json
            ${{ runner.temp }}/gore-as-signing-output/source-provenance.json
            ${{ runner.temp }}/gore-as-signing-output/github-attestation.sigstore.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          overwrite: false
