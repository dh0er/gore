          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      # Inno Setup is no longer on the windows-latest (2025) image; install it
      # for build.py's ISCC fallback path.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: python build.py gore-mod-studio installer

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $isTag = '${{ github.ref_type }}' -eq 'tag'
          $changelog = Get-Content apps/mod-studio/CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^`r`n]*`r?`n(.*?)(?=^## \[|\z)"
          $notes = ''
          if ($changelog -match $pattern) { $notes = $Matches[1].Trim() }
          if (-not $notes) {
            if ($isTag) { Write-Error "CHANGELOG.md has no non-empty section for $version"; exit 1 }
            $notes = "Development build $version"
          }
          New-Item -ItemType Directory -Force dist/gore-mod-studio | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/gore-mod-studio/RELEASE_NOTES.md'), $notes)

      - name: Generate signed appcast
        env:
          WINSPARKLE_DSA_PRIV_KEY_B64: ${{ secrets.WINSPARKLE_DSA_PRIV_KEY_B64 }}
        run: >-
          python scripts/appcast.py
          --title gore-mod-studio
          --version ${{ steps.version.outputs.version }}
          --installer dist/gore-mod-studio/gore-mod-studio-${{ steps.version.outputs.version }}-setup.exe
          --public-key apps/mod-studio/dsa_pub.pem
          --notes dist/gore-mod-studio/RELEASE_NOTES.md
          --release-tag gore-mod-studio-v${{ steps.version.outputs.version }}
          --output dist/gore-mod-studio/appcast-windows.xml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gore-mod-studio-windows-x64
          path: |
            dist/gore-mod-studio/*.zip
            dist/gore-mod-studio/*.exe
            dist/gore-mod-studio/appcast-windows.xml

      # Versioned release holds the installer the appcast enclosure points at.
      # make_latest=false so it never steals gore-save-editor's releases/latest feed.
      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          make_latest: "false"
          files: |
            dist/gore-mod-studio/*.zip
            dist/gore-mod-studio/gore-mod-studio-${{ steps.version.outputs.version }}-setup.exe
          body_path: dist/gore-mod-studio/RELEASE_NOTES.md

      # gore-mod-studio's updater polls this fixed-tag release. The asset name is
      # same every release, so use `gh release upload --clobber` to replace it
      # in place — a plain upload errors on the second release and the feed
      # would stay stuck on the first appcast.
      - name: Update gore-mod-studio appcast feed
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view gore-mod-studio-appcast 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create gore-mod-studio-appcast `
              --title "gore-mod-studio update feed" `
              --notes "Stable WinSparkle feed for gore-mod-studio. Assets overwritten each release." `
              --latest=false
          }
          gh release upload gore-mod-studio-appcast `
            dist/gore-mod-studio/appcast-windows.xml --clobber

