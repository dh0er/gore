  gore-cli:
    needs: quality-gates
    if: >-
      (github.event_name == 'push' &&
        github.ref_type == 'tag' &&
        startsWith(github.ref_name, 'gore-cli-v')) ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.project == 'gore-cli')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify version
        id: version
        shell: pwsh
        run: |
          $manifest = Get-Content crates/gore/Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+)"') {
            Write-Error 'Cargo.toml version must be X.Y.Z'
            exit 1
          }
          $version = $Matches[1]
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -ne "gore-cli-v$version") {
              Write-Error "tag $tag does not match Cargo.toml version $version"
              exit 1
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build distribution
        run: python build.py gore-cli dist

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $isTag = '${{ github.ref_type }}' -eq 'tag'
          $changelog = Get-Content crates/gore/CHANGELOG.md -Raw
