name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        # gore-save lives under projects/ in the monorepo. All `run:` steps
        # execute from here, so build.py, scripts/, installer/, dist/ and
        # CHANGELOG.md resolve relatively. NOTE: `uses:` action inputs
        # (upload/release `path:`/`files:`) are relative to the repo root, not
        # this working-directory, so those carry an explicit projects/gore-save/
        # prefix below.
        working-directory: projects/gore-save
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify version
        id: version
        shell: pwsh
        run: |
          $pubspec = Get-Content app/pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\s*$') {
            Write-Error 'pubspec.yaml version must be plain X.Y.Z (no build number)'
            exit 1
          }
          $version = $Matches[1]
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -ne "v$version") {
              Write-Error "tag $tag does not match pubspec version $version"
              exit 1
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      # GIT_SHA comes from the GITHUB_SHA env via build.py.
      - name: Build distribution
        run: python build.py dist

      # Release notes come from CHANGELOG.md only; a missing or empty
      # section for the released version fails a tag build. Non-tag runs
      # (workflow_dispatch smoke builds) fall back to a placeholder so the
      # appcast step still has notes input.
      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $isTag = '${{ github.ref_type }}' -eq 'tag'
          $changelog = Get-Content CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^`r`n]*`r?`n(.*?)(?=^## \[|\z)"
          $notes = ''
          if ($changelog -match $pattern) { $notes = $Matches[1].Trim() }
          if (-not $notes) {
            if ($isTag) {
              Write-Error "CHANGELOG.md has no non-empty section for $version"
              exit 1
            }
            $notes = "Development build $version"
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'dist\RELEASE_NOTES.md'), $notes)

      # Inno Setup 6 is preinstalled on windows-latest but not on PATH.
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" /Qp `
            "/DAppVersion=${{ steps.version.outputs.version }}" `
            "/DSourceDir=$PWD\app\build\windows\x64\runner\Release" `
            "/DOutputDir=$PWD\dist" `
            installer\setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Signs the installer and writes the appcast the app polls via
      # releases/latest/download/appcast-windows.xml.
      - name: Generate signed appcast
        env:
          WINSPARKLE_DSA_PRIV_KEY_B64: ${{ secrets.WINSPARKLE_DSA_PRIV_KEY_B64 }}
        run: >-
          python scripts/appcast.py
          --version ${{ steps.version.outputs.version }}
          --installer dist/GoresaveSetup-${{ steps.version.outputs.version }}.exe
          --notes dist/RELEASE_NOTES.md
          --output dist/appcast-windows.xml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: goresave-windows-x64
          path: |
            projects/gore-save/dist/*.zip
            projects/gore-save/dist/*.exe
            projects/gore-save/dist/appcast-windows.xml

      # The installer + appcast must be attached so that
      # releases/latest/download/ serves the update feed.
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            projects/gore-save/dist/*.zip
            projects/gore-save/dist/*.exe
            projects/gore-save/dist/appcast-windows.xml
          body_path: projects/gore-save/dist/RELEASE_NOTES.md
