name: Release

# Monorepo releases are per-project, triggered by prefixed tags:
#   gore-save-editor-vX.Y.Z  -> gore-save-editor (Flutter app, WinSparkle updater)
#   gore-mod-studio-vX.Y.Z   -> gore-mod-studio (Flutter app, WinSparkle updater)
#   gore-mod-manager-vX.Y.Z  -> gore-mod-manager (Flutter app, WinSparkle updater)
#   gore-cli-vX.Y.Z          -> gore-cli (Rust binary)
# Each job gates on its tag prefix, so one tag builds exactly one product. A
# reusable call to the normal CI workflow must pass on this exact commit before
# any product can build, sign, upload, publish, or update an appcast feed.
#
# Every updater reads a fixed-tag feed release — `gore-save-editor-appcast`,
# `gore-mod-studio-appcast`, `gore-mod-manager-appcast` — whose single
# appcast-windows.xml asset CI overwrites on each release. Those tags are
# compiled into the apps, so they must not be renamed without shipping a new
# build of the affected app.
#
# make_latest=true on gore-save-editor is therefore only about which release
# people land on at /releases/latest; no updater depends on it, so it can move
# to another product when the flagship changes. One exception, until it ages
# out: save-editor builds up to 1.2.0 poll releases/latest/download/ for their
# appcast, so moving the flag before those are gone would strand them.

on:
  push:
    tags:
      - "gore-save-editor-v*"
      - "gore-mod-studio-v*"
      - "gore-mod-manager-v*"
      - "gore-cli-v*"
  workflow_dispatch:
    inputs:
      project:
        description: "Smoke-build a project without publishing"
        type: choice
        required: true
        options: [gore-save-editor, gore-mod-studio, gore-mod-manager, gore-cli]

permissions:
  contents: write

# Code signing (Azure Trusted / Artifact Signing). Signing is opt-in in build.py
# (off by default for local builds); GORE_SIGN=1 turns it on for CI releases and
# makes a missing credential hard-fail rather than silently ship unsigned.
# Configure these as repo secrets before the next release tag
# (Settings -> Secrets and variables -> Actions):
#   AZURE_TENANT_ID / AZURE_CLIENT_ID / AZURE_CLIENT_SECRET  (signing service principal)
#   TRUSTED_SIGNING_ENDPOINT  (Account URI, e.g. https://weu.codesigning.azure.net/)
#   TRUSTED_SIGNING_ACCOUNT   (Artifact Signing account name)
#   TRUSTED_SIGNING_PROFILE   (certificate profile name)
env:
  GORE_SIGN: "1"
  TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
  TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
  TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

jobs:
  quality-gates:
    name: CI quality gates
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  gore-save-editor:
    needs: quality-gates
    if: >-
      (github.event_name == 'push' &&
        github.ref_type == 'tag' &&
        startsWith(github.ref_name, 'gore-save-editor-v')) ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.project == 'gore-save-editor')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify version
        id: version
        shell: pwsh
        run: |
          $pubspec = Get-Content apps/save-editor/pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\s*$') {
            Write-Error 'pubspec.yaml version must be plain X.Y.Z (no build number)'
            exit 1
          }
          $version = $Matches[1]
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -ne "gore-save-editor-v$version") {
              Write-Error "tag $tag does not match pubspec version $version"
              exit 1
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      # Inno Setup is no longer on the windows-latest (2025) image, so install
      # it; choco drops iscc at C:\Program Files (x86)\Inno Setup 6, which is
      # build.py's ISCC fallback path.
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # build.py builds the native DLL, the Flutter release, packages the zip,
      # and compiles the Inno installer.
      - name: Build installer
        run: python build.py gore-save-editor installer

      - name: Extract release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $isTag = '${{ github.ref_type }}' -eq 'tag'
          $changelog = Get-Content apps/save-editor/CHANGELOG.md -Raw
          $pattern = "(?ms)^## \[$([regex]::Escape($version))\][^`r`n]*`r?`n(.*?)(?=^## \[|\z)"
          $notes = ''
          if ($changelog -match $pattern) { $notes = $Matches[1].Trim() }
          if (-not $notes) {
            if ($isTag) { Write-Error "CHANGELOG.md has no non-empty section for $version"; exit 1 }
            $notes = "Development build $version"
          }
          New-Item -ItemType Directory -Force dist/gore-save-editor | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/gore-save-editor/RELEASE_NOTES.md'), $notes)

      - name: Generate signed appcast
        env:
          WINSPARKLE_DSA_PRIV_KEY_B64: ${{ secrets.WINSPARKLE_DSA_PRIV_KEY_B64 }}
        run: >-
          python scripts/appcast.py
          --title gore-save-editor
          --version ${{ steps.version.outputs.version }}
          --installer dist/gore-save-editor/gore-save-editor-${{ steps.version.outputs.version }}-setup.exe
          --public-key apps/save-editor/dsa_pub.pem
          --notes dist/gore-save-editor/RELEASE_NOTES.md
          --release-tag gore-save-editor-v${{ steps.version.outputs.version }}
          --output dist/gore-save-editor/appcast-windows.xml

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gore-save-editor-windows-x64
          path: |
            dist/gore-save-editor/*.zip
            dist/gore-save-editor/*.exe
            dist/gore-save-editor/appcast-windows.xml

      # make_latest=true purely so the repo's landing release is the flagship
      # product. The updater no longer depends on it (see the feed step below),
      # so this flag can move to another product without breaking any client.
      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          make_latest: "true"
          files: |
            dist/gore-save-editor/*.zip
            dist/gore-save-editor/*.exe
            dist/gore-save-editor/appcast-windows.xml
          body_path: dist/gore-save-editor/RELEASE_NOTES.md

      # Same fixed-tag feed the other two products use. Builds up to 1.2.0 read
      # releases/latest/download/appcast-windows.xml instead; that keeps working
      # as long as make_latest stays here, and the release above still publishes
      # the identical asset. Drop that older path only once no supported build
      # relies on it.
      - name: Update gore-save-editor appcast feed
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view gore-save-editor-appcast 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create gore-save-editor-appcast `
              --title "gore-save-editor update feed" `
              --notes "Stable WinSparkle feed for gore-save-editor. Assets overwritten each release." `
              --latest=false
          }
          gh release upload gore-save-editor-appcast `
            dist/gore-save-editor/appcast-windows.xml --clobber

  gore-mod-studio:
    needs: quality-gates
    if: >-
      (github.event_name == 'push' &&
        github.ref_type == 'tag' &&
        startsWith(github.ref_name, 'gore-mod-studio-v')) ||
      (github.event_name == 'workflow_dispatch' &&
        inputs.project == 'gore-mod-studio')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify version
        id: version
        shell: pwsh
        run: |
          $pubspec = Get-Content apps/mod-studio/pubspec.yaml -Raw
          if ($pubspec -notmatch '(?m)^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\s*$') {
            Write-Error 'pubspec.yaml version must be plain X.Y.Z (no build number)'
            exit 1
