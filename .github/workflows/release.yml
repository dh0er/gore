          $notes = ''
          if ($changelog -match $pattern) { $notes = $Matches[1].Trim() }
          if (-not $notes) {
            if ($isTag) { Write-Error "CHANGELOG.md has no non-empty section for $version"; exit 1 }
            $notes = "Development build $version"
          }
          New-Item -ItemType Directory -Force dist/gore-cli | Out-Null
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/gore-cli/RELEASE_NOTES.md'), $notes)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gore-cli-windows-x64
          path: dist/gore-cli/*.zip

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          make_latest: "false"
          files: dist/gore-cli/*.zip
          body_path: dist/gore-cli/RELEASE_NOTES.md
