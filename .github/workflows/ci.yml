name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        # gore-save lives under projects/ in the monorepo; test.py + its
        # relative paths resolve from here. cargo walks up to the workspace root.
        working-directory: projects/gore-save
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      # test.py resolves cargo/flutter from PATH (provided above), so no FVM
      # fallback is needed on CI. The Rust suite (`cargo test`) walks up to the
      # workspace root, so it already covers gore_core + gore_cli; only the
      # Flutter analyze/test here are scoped to gore-save/app.
      - name: Run all tests (rust, tools, analyze, flutter)
        run: python test.py all

      # The gore-mod GUI is a separate Flutter package; test.py's APP points at
      # gore-save/app, so its analyze/test never reach it. Run it explicitly so
      # regressions in the GUI can't merge unnoticed.
      - name: gore-mod analyze + test
        working-directory: projects/gore-mod/app
        run: |
          flutter pub get
          flutter analyze
          flutter test
