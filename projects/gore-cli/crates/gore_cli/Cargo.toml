[package]
name = "gore_cli"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "gore-cli"
path = "src/main.rs"

[dependencies]
gore_core = { path = "../../../gore-core/crates/gore_core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "2"
