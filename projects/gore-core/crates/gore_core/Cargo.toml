[package]
name = "gore_core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared reflection/catalog model + mod-generation engine for gore-tools."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
pretty_assertions = "1"
