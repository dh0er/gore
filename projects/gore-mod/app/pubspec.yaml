publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  ffi: ^2.1.4
  file_selector: ^1.0.3
  flutter_riverpod: ^3.2.1
